            margin-bottom: 20px;

            margin: 5px; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            background-color: #1a73e8; 
            color: white;

            font-weight: bold;

            50% { transform: scale(1.05); }

            "en": "<b>Enska (English):</b><br><b>Explanation:</b> Very much, more than other things.<br>Or something done for a specific reason. (adverb)<br><b>Synonyms:</b> particularly, especially, specially.<br><b>Antonyms:</b> generally, normally.<br><b>Examples:</b> 1. This is an <b>especially</b> beautiful song. 2. I baked this cake <b>specially</b> for you.",
            "tl": "<b>Filippseyska (Tagalog):</b><br><b>Paliwanag:</b> Sobra, higit sa iba.<br>O ginawa para sa isang tiyak na dahilan. (pang-abay)<br><b>Kasingkahulugan:</b> partikular, lalo na.<br><b>Kasalungat:</b> pangkalahatan.<br><b>Halimbawa:</b> 1. Ito ay isang <b>lalong</b> magandang kanta. 2. Niluto ko ang cake na ito <b>partikular</b> para sa iyo.",
            "fr": "<b>Franska (Français):</b><br><b>Explication:</b> Beaucoup, plus que d'autres choses.<br>Ou fait pour une raison précise. (adverbe)<br><b>Synonymes:</b> particulièrement, spécialement.<br><b>Antonymes:</b> généralement, en général.<br><b>Exemples:</b> 1. C'est une chanson <b>particulièrement</b> belle. 2. J'ai préparé ce gâteau <b>spécialement</b> pour toi.",
            "it": "<b>Ítalska (Italiano):</b><br><b>Spiegazione:</b> Molto, più di altre cose.<br>O fatto per un motivo specifico. (avverbio)<br><b>Sinonimi:</b> particolarmente, appositamente, specialmente.<br><b>Antonimi:</b> generalmente.<br><b>Esempi:</b> 1. Questa è una canzone <b>particolarmente</b> bella. 2. Ho preparato questa torta <b>appositamente</b> per te.",
            "zh": "<b>Kínverska (中文):</b><br><b>解释:</b> 非常，超过其他事物。<br>或为特定目的而做。 (副词)<br><b>同义词:</b> 特别，尤其，专门。<br><b>反义词:</b> 一般，普遍。<br><b>例句:</b> 1. 这是一首<b>特别</b>优美的歌。2. 我<b>专门</b>为你烤了这个蛋糕。",
            "ku": "<b>Kúrdíska (Kurdî):</b><br><b>Ravekirin:</b> Gelek, zêdetir ji tiştên din.<br>An jî ji bo sedemek taybetî hatiye kirin. (hoker)<br><b>Hevwate:</b> bi taybetî, bi taybet.<br><b>Dijwate:</b> bi giştî.<br><b>Mînak:</b> 1. Ev stranek <b>bi taybetî</b> xweş e. 2. Min ev kek <b>taybet</b> ji bo te çêkir.",
            "lv": "<b>Lettneska (Latviešu):</b><br><b>Paskaidrojums:</b> Ļoti daudz, vairāk nekā cits.<br>Vai darīts noteiktam mērķim. (apstākļa vārds)<br><b>Sinonīmi:</b> īpaši, it sevišķi.<br><b>Antonīmi:</b> vispārīgi.<br><b>Piemēri:</b> 1. Šī ir <b>īpaši</b> skaista dziesma. 2. Es izcepu šo kūku <b>īpaši</b> tev.",
            "lt": "<b>Litháíska (Lietuvių):</b><br><b>Paaiškinimas:</b> Labai daug, daugiau nei kiti.<br>Arba padaryta tam tikram tikslui. (prievezmis)<br><b>Sinonimai:</b> ypač, specialiai.<br><b>Antonimai:</b> apskritai, paprastai.<br><b>Pavyzdžiai:</b> 1. Tai <b>ypač</b> graži daina. 2. Iškepiau šį pyragą <b>specialiai</b> tau.",
            "no": "<b>Norska (Norsk):</b><br><b>Forklaring:</b> Veldig mye, mer enn annet.<br>Eller noe gjort for en bestemt anledning. (adverb)<br><b>Synonymer:</b> spesielt, særlig.<br><b>Antonymer:</b> generelt, vanligvis.<br><b>Eksempler:</b> 1. Dette er en <b>spesielt</b> vakker sang. 2. Jeg bakte denne kaken <b>spesielt</b> for deg.",
            "fa": "<div dir='rtl' style='text-align: right;'><b>Persneska (فارسی):</b><br><b>توضیح:</b> بسیار زیاد، بیشتر از چیزهای دیگر.<br>یا انجام شده برای هدف خاص. (قید)<br><b>مترادف:</b> به‌ویژه، مخصوصاً.<br><b>متضاد:</b> عموماً، به‌طور کلی.<br><b>مثال:</b> 1. این یک آهنگ <b>به‌ویژه</b> زیبا است. 2. این کیک را <b>مخصوص</b> تو پختم.</div>",
            "pt": "<b>Portúgalska (Português):</b><br><b>Explicação:</b> Muito, mais do que outras coisas.<br>Ou algo feito para uma ocasião específica. (advérbio)<br><b>Sinônimos:</b> particularmente, especialmente.<br><b>Antônimos:</b> geralmente.<br><b>Exemplos:</b> 1. Esta é uma música <b>especialmente</b> linda. 2. Eu assei este bolo <b>especialmente</b> para você.",
            "pt-BR": "<b>Portúgalska - Brasilía (Português - Brasil):</b><br><b>Explicação:</b> Muito, mais do que outras coisas.<br>Ou algo feito para uma ocasião específica. (advérbio)<br><b>Sinônimos:</b> particularmente, especialmente.<br><b>Antônimos:</b> geralmente.<br><b>Exemplos:</b> 1. Esta é uma música <b>especialmente</b> linda. 2. Eu assei este bolo <b>especialmente</b> para você.",
            "pl": "<b>Pólska (Polski):</b><br><b>Wyjaśnienie:</b> Bardzo, więcej niż inne rzeczy.<br>Lub zrobione z konkretnego powodu. (przysłówek)<br><b>Synonimy:</b> w szczególności, szczególnie, specjalnie.<br><b>Antonimy:</b> ogólnie, powszechnie.<br><b>Przykłady:</b> 1. To jest <b>szczególnie</b> piękna piosenka. 2. Upiekłem to ciasto <b>specjalnie</b> dla ciebie.",
            "ro": "<b>Rúmenska (Română):</b><br><b>Explicație:</b> Foarte mult.<br>Sau ceva făcut cu un anumit scop. (adverb)<br><b>Sinonime:</b> în special, deosebit, special.<br><b>Antonime:</b> în general, de obicei.<br><b>Exemple:</b> 1. Acesta este un cântec <b>deosebit</b> de frumos. 2. Am copt acest tort <b>special</b> pentru tine.",
            "ru": "<b>Rússneska (Русский):</b><br><b>Объяснение:</b> Очень много, больше чем другое.<br>Либо для конкретной цели. (наречие)<br><b>Синонимы:</b> в частности, особенно, специально.<br><b>Антонимы:</b> в общем, обычно.<br><b>Примеры:</b> 1. Это <b>особенно</b> красивая песня. 2. Я испек этот торт <b>специально</b> для тебя.",
            "so": "<b>Sómalska (Soomaali):</b><br><b>Sharaxaad:</b> Aad u badan, in ka badan wax kale.<br>Ama wax loo sameeyay sabab gaar ah. (falkaab)<br><b>Ereyo isku macno ah:</b> gaar ahaan, si gaar ah.<br><b>Ereyo lid ku ah:</b> guud ahaan.<br><b>Tusaalayaal:</b> 1. Kani waa hees <b>gaar ahaan</b> qurux badan. 2. Waxaan keegan kuu dubay <b>si gaar ah</b> adiga.",
            "es": "<b>Spænska (Español):</b><br><b>Explicación:</b> Mucho, más que otras cosas.<br>O algo hecho para una ocasión específica. (adverbio)<br><b>Sinónimos:</b> particularmente, especialmente.<br><b>Antónimos:</b> generalmente.<br><b>Ejemplos:</b> 1. Esta es una canción <b>especialmente</b> hermosa. 2. Horneé este pastel <b>especialmente</b> para ti.",
            "sw": "<b>Swahili (Kiswahili):</b><br><b>Maelezo:</b> Sana, zaidi ya vitu vingine.<br>Au kitu kilichofanywa kwa sababu maalum. (kielezi)<br><b>Visawe:</b> hasa, kipekee.<br><b>Vinyume:</b> kwa ujumla.<br><b>Mifano:</b> 1. Huu ni wimbo mzuri <b>hasa</b>. 2. Nilioka keki hii <b>kipekee</b> kwa ajili yako.",
            "sv": "<b>Sænska (Svenska):</b><br><b>Förklaring:</b> Mycket, mer än annat.<br>Eller något gjort för ett visst tillfälle. (adverb)<br><b>Synonymer:</b> i synnerhet, särskilt, speciellt.<br><b>Antonymer:</b> allmänt, generellt.<br><b>Exempel:</b> 1. Detta är en <b>särskilt</b> vacker låt. 2. Jag bakade den här tårtan <b>speciellt</b> för dig.",
            "th": "<b>Tælenska (ภาษาไทย):</b><br><b>คำอธิบาย:</b> มาก มากกว่าสิ่งอื่น<br>หรือทำขึ้นสำหรับโอกาสเฉพาะ (คำกริยาวิเศษณ์)<br><b>คำพ้องความหมาย:</b> โดยเฉพาะ, เป็นพิเศษ<br><b>คำตรงข้าม:</b> โดยทั่วไป<br><b>ตัวอย่าง:</b> 1. นี่เป็นเพลงที่ไพเราะ<b>เป็นพิเศษ</b> 2. ฉันอบเค้กนี้เพื่อคุณ<b>โดยเฉพาะ</b>",
            "uk": "<b>Úkraínska (Українська):</b><br><b>Пояснення:</b> Дуже багато.<br>Або щось зроблене з певною метою. (прислівник)<br><b>Синоніми:</b> зокрема, особливо, спеціально.<br><b>Антоніми:</b> загалом, взагалі.<br><b>Приклади:</b> 1. Це <b>особливо</b> гарна пісня. 2. Я спік цей торт <b>спеціально</b> для тебе.",
            "vi": "<b>Víetnamska (Tiếng Việt):</b><br><b>Giải thích:</b> Rất nhiều, hơn những thứ khác.<br>Hoặc một cái gì đó được làm cho mục đích cụ thể. (trạng từ)<br><b>Từ đồng nghĩa:</b> đặc biệt, nhất là.<br><b>Từ trái nghĩa:</b> nhìn chung, nói chung.<br><b>Ví dụ:</b> 1. Đây là một bài hát <b>đặc biệt</b> hay. 2. Tôi làm chiếc bánh này <b>đặc biệt</b> cho bạn.",
            "de": "<b>Þýska (Deutsch):</b><br><b>Erklärung:</b> Sehr viel, mehr als anderes.<br>Oder aus einem bestimmten Anlass. (Adverb)<br><b>Synonyme:</b> besonders, speziell.<br><b>Antonyme:</b> allgemein, generell.<br><b>Beispiele:</b> 1. Das ist ein <b>besonders</b> schönes Lied. 2. Ich habe diesen Kuchen <b>speziell</b> für dich gebacken."
        }

            "et": "<b>Eistneska (Eesti):</b><br><b>Selgitus:</b> Luba millegi tegemiseks.<br>Või infoallikas. (nimisõna)<br><b>Sünonüümid:</b> luba, nõusolek, allikas.<br><b>Näited:</b> 1. Siin on õpetaja <b>luba</b>. 2. See raamat on hea <b>allikas</b> ajaloo kohta.",
            "en": "<b>Enska (English):</b><br><b>Explanation:</b> Permission to do something.<br>Or a source of information (book, article). (noun)<br><b>Synonyms:</b> consent, authorization, source, reference.<br><b>Examples:</b> 1. Here is the <b>permission</b> from the teacher. 2. This book is a good <b>source</b> of history.",
            "tl": "<b>Filippseyska (Tagalog):</b><br><b>Paliwanag:</b> Pahintulot na gumawa ng isang bagay.<br>O pinagmulan ng impormasyon. (pangngalan)<br><b>Kasingkahulugan:</b> permiso, pahintulot, batayan, pinagmulan.<br><b>Halimbawa:</b> 1. Narito ang <b>pahintulot</b> mula sa guro. 2. Ang aklat na ito ay isang magandang <b>mapagkukunan</b> ng kasaysayan.",

            "it": "<b>Ítalska (Italiano):</b><br><b>Spiegazione:</b> Permesso di fare qualcosa.<br>O una fonte di informazioni. (sostantivo)<br><b>Sinonimi:</b> permesso, autorizzazione, fonte.<br><b>Esempi:</b> 1. Ecco il <b>permesso</b> dell'insegnante. 2. Questo libro è una buona <b>fonte</b> di storia.",
            "zh": "<b>Kínverska (中文):</b><br><b>解释:</b> 做某事的许可。<br>或信息的来源。 (名词)<br><b>同义词:</b> 许可, 授权, 来源。<br><b>例句:</b> 1. 这是老师的<b>许可</b>。2. 这本书是很好的历史<b>来源</b>。",
            "ku": "<b>Kúrdíska (Kurdî):</b><br><b>Ravekirin:</b> Destûr.<br>An jî çavkaniya agahiyan. (navdêr)<br><b>Hevwate:</b> destûr, çavkanî.<br><b>Mînak:</b> 1. Ev <b>destûr</b>a mamoste ye. 2. Ev pirtûk <b>çavkaniyek</b> baş e ji bo dîrokê.",
            "lv": "<b>Lettneska (Latviešu):</b><br><b>Paskaidrojums:</b> Atļauja kaut ko darīt.<br>Vai informācijas avots. (lietvārds)<br><b>Sinonīmi:</b> atļauja, pilnvara, avots.<br><b>Piemēri:</b> 1. Šeit ir <b>atļauja</b> no skolotāja. 2. Šī grāmata ir labs <b>avots</b> par vēsturi.",
            "lt": "<b>Litháíska (Lietuvių):</b><br><b>Paaiškinimas:</b> Leidimas kažką daryti.<br>Arba informacijos šaltinis. (daiktavardis)<br><b>Sinonimai:</b> sutikimas, leidimas, šaltinis.<br><b>Pavyzdžiai:</b> 1. Čia yra mokytojo <b>leidimas</b>. 2. Ši knyga yra geras istorijos <b>šaltinis</b>.",
            "no": "<b>Norska (Norsk):</b><br><b>Forklaring:</b> Tillatelse til å gjøre noe.<br>Eller en kilde til informasjon. (substantiv)<br><b>Synonymer:</b> tillatelse, godkjennelse, kilde.<br><b>Eksempler:</b> 1. Her er <b>tillatelsen</b> fra læreren. 2. Denne boken er en god <b>kilde</b> om historien.",

            "pt": "<b>Portúgalska (Português):</b><br><b>Explicação:</b> Permissão para fazer algo.<br>Ou fonte de informação. (substantivo)<br><b>Sinônimos:</b> autorização, permissão, fonte.<br><b>Exemplos:</b> 1. Aqui está a <b>permissão</b> do professor. 2. Este livro é uma boa <b>fonte</b> sobre a história.",

            "pl": "<b>Pólska (Polski):</b><br><b>Wyjaśnienie:</b> Pozwolenie na zrobienie czegoś.<br>Lub źródło informacji. (rzeczownik)<br><b>Synonimy:</b> zgoda, pozwolenie, źródło.<br><b>Przykłady:</b> 1. Tutaj jest <b>pozwolenie</b> od nauczyciela. 2. Ta książka to dobre <b>źródło</b> historii.",

            "sw": "<b>Swahili (Kiswahili):</b><br><b>Maelezo:</b> Ruhusa ya kufanya kitu.<br>Au chanzo cha habari. (nomino)<br><b>Visawe:</b> ruhusa, idhini, chanzo.<br><b>Mifano:</b> 1. Hapa kuna <b>ruhusa</b> kutoka kwa mwalimu. 2. Kitabu hiki ni <b>chanzo</b> kizuri cha historia.",

            "ku": "<b>Kúrdíska (Kurdî):</b><br><b>Ravekirin:</b> Tiştek ku tê bîra mirov, çareseriyek an pêşniyarek. (navdêr)<br><b>Hevwate:</b> pêşniyar, raman, fîkîr.<br><b>Dijwate:</b> rastî.<br><b>Mînak:</b> Ev <b>fikrek</b> gelek baş e ji bo projeya nû.",
            "lv": "<b>Lettneska (Latviešu):</b><br><b>Paskaidrojums:</b> Kaut kas, kas ienāk prātā, risinājums vai priekšlikums. (lietvārds)<br><b>Sinonīmi:</b> priekšlikums, ideja.<br><b>Antonīmi:</b> fakts.<br><b>Piemēri:</b> Šī ir ļoti laba <b>ideja</b> jaunam projektam.",
            "lt": "<b>Litháíska (Lietuvių):</b><br><b>Paaiškinimas:</b> Kažkas, kas ateina į galvą, sprendimas ar pasiūlymas. (daiktavardis)<br><b>Sinonimai:</b> pasiūlymas, idėja, mintis.<br><b>Antonimai:</b> faktas.<br><b>Pavyzdys:</b> Tai labai gera <b>idėja</b> naujam projektui.",
            "no": "<b>Norska (Norsk):</b><br><b>Forklaring:</b> Noe man tenker på, en løsning eller et forslag. (substantiv)<br><b>Synonymer:</b> forslag, idé, tanke.<br><b>Antonymer:</b> faktum.<br><b>Eksempel:</b> Dette er en veldig god <b>idé</b> til et nytt prosjekt.",
            "fa": "<div dir='rtl' style='text-align: right;'><b>Persneska (فارسی):</b><br><b>توضیح:</b> چیزی که به ذهن می‌رسد، راه حل یا پیشنهاد. (اسم)<br><b>مترادف:</b> پیشنهاد، ایده، فکر.<br><b>متضاد:</b> واقعیت.<br><b>مثال:</b> این یک <b>ایده</b> بسیار خوب برای یک پروژه جدید است.</div>",
            "pt": "<b>Portúgalska (Português):</b><br><b>Explicação:</b> Algo que vem à mente, uma solução ou sugestão. (substantivo)<br><b>Sinônimos:</b> proposta, ideia, pensamento.<br><b>Antônimos:</b> fato.<br><b>Exemplo:</b> Esta é uma <b>ideia</b> muito boa para um novo projeto.",
            "pt-BR": "<b>Portúgalska - Brasilía (Português - Brasil):</b><br><b>Explicação:</b> Algo que vem à mente, uma solução ou sugestão. (substantivo)<br><b>Sinônimos:</b> proposta, ideia, pensamento.<br><b>Antônimos:</b> fato.<br><b>Exemplo:</b> Esta é uma <b>ideia</b> muito boa para um novo projeto.",
            "pl": "<b>Pólska (Polski):</b><br><b>Wyjaśnienie:</b> Coś, co przychodzi na myśl, rozwiązanie, propozycja. (rzeczownik)<br><b>Synonimy:</b> propozycja, pomysł, myśl.<br><b>Antonimy:</b> fakt.<br><b>Przykład:</b> To bardzo dobry <b>pomysł</b> na nowy projekt.",
            "ro": "<b>Rúmenska (Română):</b><br><b>Explicație:</b> Ceva care îți vine în minte, o soluție sau o propunere. (substantiv)<br><b>Sinonime:</b> propunere, idee, gând.<br><b>Antonime:</b> fapt.<br><b>Exemplu:</b> Aceasta este o <b>idee</b> foarte bună pentru un nou proiect.",
            "ru": "<b>Rússneska (Русский):</b><br><b>Объяснение:</b> То, что приходит на ум, решение или предложение. (существительное)<br><b>Синонимы:</b> предложение, мысль, идея.<br><b>Антонимы:</b> факт.<br><b>Пример:</b> Это очень хорошая <b>идея</b> для нового проекта.",
            "so": "<b>Sómalska (Soomaali):</b><br><b>Sharaxaad:</b> Wax maskaxda ku soo dhaca, xal ama soo jeedin. (magac)<br><b>Ereyo isku macno ah:</b> soo jeedin, fikrad, feker.<br><b>Ereyo lid ku ah:</b> xaqiiqo.<br><b>Tusaale:</b> Tani waa <b>fikrad</b> aad u wanaagsan oo mashruuc cusub ah.",
            "es": "<b>Spænska (Español):</b><br><b>Explicación:</b> Algo que se te ocurre, una solución o sugerencia. (sustantivo)<br><b>Sinónimos:</b> propuesta, idea, pensamiento.<br><b>Antónimos:</b> hecho.<br><b>Ejemplo:</b> Esta es una muy buena <b>idea</b> para un nuevo proyecto.",
            "sw": "<b>Swahili (Kiswahili):</b><br><b>Maelezo:</b> Kitu kinachokuja akilini, suluhisho au pendekezo. (nomino)<br><b>Visawe:</b> pendekezo, wazo, fikra.<br><b>Vinyume:</b> ukweli.<br><b>Mfano:</b> Hili ni <b>wazo</b> zuri sana kwa mradi mpya.",
            "sv": "<b>Sænska (Svenska):</b><br><b>Förklaring:</b> Något man tänker på, en lösning eller ett förslag. (substantiv)<br><b>Synonymer:</b> förslag, idé, tanke.<br><b>Antonymer:</b> faktum.<br><b>Exempel:</b> Detta är en mycket bra <b>idé</b> för ett nytt projekt.",
            "th": "<b>Tælenska (ภาษาไทย):</b><br><b>คำอธิบาย:</b> สิ่งที่ผุดขึ้นมาในหัว, ทางออก หรือข้อเสนอแนะ (คำนาม)<br><b>คำพ้องความหมาย:</b> ข้อเสนอ, ไอเดีย, ความคิด<br><b>คำตรงข้าม:</b> ข้อเท็จจริง<br><b>ตัวอย่าง:</b> นี่เป็น<b>ไอเดีย</b>ที่ดีมากสำหรับโปรเจกต์ใหม่",
            "uk": "<b>Úkraínska (Українська):</b><br><b>Пояснення:</b> Те, що спадає на думку, рішення чи пропозиція. (іменник)<br><b>Синоніми:</b> пропозиція, ідея, думка.<br><b>Антоніми:</b> факт.<br><b>Приклад:</b> Це дуже хороша <b>ідея</b> для нового проекту.",
            "vi": "<b>Víetnamska (Tiếng Việt):</b><br><b>Giải thích:</b> Điều gì đó nảy ra trong đầu, giải pháp hoặc đề xuất. (danh từ)<br><b>Từ đồng nghĩa:</b> đề xuất, ý tưởng, suy nghĩ.<br><b>Từ trái nghĩa:</b> sự thật.<br><b>Ví dụ:</b> Đây là một <b>ý tưởng</b> rất hay cho dự án mới.",
            "de": "<b>Þýska (Deutsch):</b><br><b>Erklärung:</b> Etwas, das einem in den Sinn kommt, eine Lösung oder ein Vorschlag. (Substantiv)<br><b>Synonyme:</b> Vorschlag, Idee, Gedanke.<br><b>Antonyme:</b> Fakt.<br><b>Beispiel:</b> Das ist eine sehr gute <b>Idee</b> für ein neues Projekt."
        }

    { 
        text: "bæta", 
        is_exp: "<b>Útskýring:</b> Að gera eitthvað betra, laga eitthvað brotið.<br>Eða að auka við eitthvað (t.d. bæta vatni í). (sagnorð)<br><b>Samheiti:</b> laga, betrumbæta, auka.<br><b>Andheiti:</b> skemma, versna, minnka.<br><b>Dæmi:</b> 1. Við ætlum að <b>bæta</b> okkur í íslensku. 2. Viltu <b>bæta</b> við meiri mjólk?",
        translations: {
            "sq": "<b>Albanska (Shqip):</b><br><b>Shpjegimi:</b> Të bësh diçka më të mirë, të riparosh.<br>Ose të shtosh. (folje)<br><b>Sinonimet:</b> riparoj, përmirësoj, shtoj.<br><b>Antonimet:</b> dëmtoj, përkeqësoj, pakësoj.<br><b>Shembuj:</b> 1. Ne do të <b>përmirësohemi</b> në islandisht. 2. A dëshiron të <b>shtosh</b> më shumë qumësht?",
            "ar": "<div dir='rtl' style='text-align: right;'><b>Arabíska (العربية):</b><br><b>الشرح:</b> جعل شيء ما أفضل، إصلاح.<br>أو الإضافة إلى شيء. (فعل)<br><b>مرادف:</b> إصلاح، تحسين، إضافة.<br><b>مضاد:</b> إتلاف، تقليل.<br><b>مثال:</b> 1. سنحاول <b>التحسن</b> في الآيسلندية. 2. هل تريد <b>إضافة</b> المزيد من الحليب؟</div>",
            "da": "<b>Danska (Dansk):</b><br><b>Forklaring:</b> At gøre noget bedre, reparere.<br>Eller at tilføje mere. (udsagnsord)<br><b>Synonymer:</b> reparere, forbedre, tilføje.<br><b>Antonymer:</b> ødelægge, forværre, mindske.<br><b>Eksempler:</b> 1. Vi vil <b>forbedre</b> os i islandsk. 2. Vil du <b>tilføje</b> mere mælk?",
            "et": "<b>Eistneska (Eesti):</b><br><b>Selgitus:</b> Midagi paremaks tegema, parandama.<br>Või lisama. (tegusõna)<br><b>Sünonüümid:</b> parandama, täiustama, lisama.<br><b>Antonüümid:</b> kahjustama, halvendama, vähendama.<br><b>Näited:</b> 1. Me kavatseme end <b>parandada</b> islandi keeles. 2. Kas sa tahad <b>lisada</b> piima?",
            "en": "<b>Enska (English):</b><br><b>Explanation:</b> To make something better, repair.<br>Or to add more to something. (verb)<br><b>Synonyms:</b> fix, improve, add.<br><b>Antonyms:</b> damage, worsen, reduce.<br><b>Examples:</b> 1. We are going to <b>improve</b> ourselves in Icelandic. 2. Do you want to <b>add</b> more milk?",
            "tl": "<b>Filippseyska (Tagalog):</b><br><b>Paliwanag:</b> Para mas pagandahin ang isang bagay, ayusin.<br>O magdagdag. (pandiwa)<br><b>Kasingkahulugan:</b> ayusin, pagbutihin, idagdag.<br><b>Kasalungat:</b> sirain, palalain, bawasan.<br><b>Halimbawa:</b> 1. <b>Pagbubutihin</b> natin ang ating sarili. 2. Gusto mo bang <b>magdagdag</b> ng gatas?",
            "fr": "<b>Franska (Français):</b><br><b>Explication:</b> Rendre quelque chose meilleur, réparer.<br>Ou ajouter. (verbe)<br><b>Synonymes:</b> réparer, améliorer, ajouter.<br><b>Antonymes:</b> abîmer, aggraver, réduire.<br><b>Exemples:</b> 1. Nous allons nous <b>améliorer</b> en islandais. 2. Veux-tu <b>ajouter</b> plus de lait ?",
            "it": "<b>Ítalska (Italiano):</b><br><b>Spiegazione:</b> Rendere qualcosa migliore, riparare.<br>O aggiungere di più. (verbo)<br><b>Sinonimi:</b> aggiustare, migliorare, aggiungere.<br><b>Antonimi:</b> danneggiare, peggiorare, ridurre.<br><b>Esempi:</b> 1. Miglioreremo il nostro islandese. 2. Vuoi <b>aggiungere</b> altro latte?",
            "zh": "<b>Kínverska (中文):</b><br><b>解释:</b> 使某事物变得更好，修理。<br>或增加。 (动词)<br><b>同义词:</b> 修理, 改善, 增加。<br><b>反义词:</b> 损坏, 恶化, 减少。<br><b>例句:</b> 1. 我们会在冰岛语上<b>提高</b>自己。2. 你想<b>多加</b>点牛奶吗？",
            "ku": "<b>Kúrdíska (Kurdî):</b><br><b>Ravekirin:</b> Tiştekî baştir kirin, çêkirin.<br>An jî lê zêde kirin. (lêker)<br><b>Hevwate:</b> çêkirin, baştir kirin, zêde kirin.<br><b>Dijwate:</b> xera kirin, xirabtir kirin, kêm kirin.<br><b>Mînak:</b> 1. Em ê di îzlandî de xwe <b>baştir bikin</b>. 2. Ma tu dixwazî ​​şîr <b>lê zêde bikî</b>?",
            "lv": "<b>Lettneska (Latviešu):</b><br><b>Paskaidrojums:</b> Padarīt kaut ko labāku, salabot.<br>Vai pievienot vairāk. (darbības vārds)<br><b>Sinonīmi:</b> labot, uzlabot, pievienot.<br><b>Antonīmi:</b> sabojāt, pasliktināt, samazināt.<br><b>Piemēri:</b> 1. Mēs grasāmies <b>uzlaboties</b> islandiešu valodā. 2. Vai vēlies <b>pievienot</b> pienu?",
            "lt": "<b>Litháíska (Lietuvių):</b><br><b>Paaiškinimas:</b> Padaryti kažką geresnio, taisyti.<br>Arba pridėti. (veiksmažodis)<br><b>Sinonimai:</b> taisyti, tobulinti, pridėti.<br><b>Antonimai:</b> sugadinti, pabloginti, sumažinti.<br><b>Pavyzdžiai:</b> 1. Mes ketiname <b>patobulėti</b> islandų kalboje. 2. Ar nori <b>pridėti</b> daugiau pieno?",
            "no": "<b>Norska (Norsk):</b><br><b>Forklaring:</b> Å gjøre noe bedre, reparere.<br>Eller å legge til mer. (verb)<br><b>Synonymer:</b> fikse, forbedre, tilføye.<br><b>Antonymer:</b> ødelegge, forverre, minske.<br><b>Eksempler:</b> 1. Vi skal <b>forbedre</b> oss i islandsk. 2. Vil du <b>tilføye</b> mer melk?",
            "fa": "<div dir='rtl' style='text-align: right;'><b>Persneska (فارسی):</b><br><b>توضیح:</b> بهتر کردن چیزی، تعمیر کردن.<br>یا اضافه کردن. (فعل)<br><b>مترادف:</b> اصلاح کردن، بهبود بخشیدن، افزودن.<br><b>متضاد:</b> خراب کردن، بدتر کردن، کم کردن.<br><b>مثال:</b> 1. ما قصد داریم خودمان را در زبان ایسلندی <b>بهبود بخشیم</b>. 2. می‌خواهی شیر <b>اضافه کنی</b>؟</div>",
            "pt": "<b>Portúgalska (Português):</b><br><b>Explicação:</b> Tornar algo melhor, consertar.<br>Ou adicionar mais. (verbo)<br><b>Sinônimos:</b> consertar, melhorar, adicionar.<br><b>Antônimos:</b> estragar, piorar, reduzir.<br><b>Exemplos:</b> 1. Nós vamos <b>melhorar</b> o nosso islandês. 2. Quer <b>adicionar</b> mais leite?",
            "pt-BR": "<b>Portúgalska - Brasilía (Português - Brasil):</b><br><b>Explicação:</b> Tornar algo melhor, consertar.<br>Ou adicionar mais. (verbo)<br><b>Sinônimos:</b> consertar, melhorar, adicionar.<br><b>Antônimos:</b> estragar, piorar, reduzir.<br><b>Exemplos:</b> 1. Nós vamos <b>melhorar</b> nosso islandês. 2. Você quer <b>adicionar</b> mais leite?",
            "pl": "<b>Pólska (Polski):</b><br><b>Wyjaśnienie:</b> Zrobić coś lepiej, naprawić.<br>Lub dodać więcej. (czasownik)<br><b>Synonimy:</b> naprawić, poprawić, dodać.<br><b>Antonimy:</b> zepsuć, pogorszyć, zmniejszyć.<br><b>Przykłady:</b> 1. Zamierzamy <b>poprawić</b> się w islandzkim. 2. Czy chcesz <b>dodać</b> więcej mleka?",
            "ro": "<b>Rúmenska (Română):</b><br><b>Explicație:</b> A face ceva mai bun, a repara.<br>Sau a adăuga mai mult. (verb)<br><b>Sinonime:</b> a repara, a îmbunătăți, a adăuga.<br><b>Antonime:</b> a strica, a înrăutăți, a reduce.<br><b>Exemple:</b> 1. Vom <b>îmbunătăți</b> islandeza noastră. 2. Vrei să <b>adaugi</b> mai mult lapte?",
            "ru": "<b>Rússneska (Русский):</b><br><b>Объяснение:</b> Сделать что-то лучше, починить.<br>Или добавить. (глагол)<br><b>Синонимы:</b> исправить, улучшить, добавить.<br><b>Антонимы:</b> испортить, ухудшить, убавить.<br><b>Примеры:</b> 1. Мы собираемся <b>улучшить</b> наш исландский. 2. Хочешь <b>добавить</b> молока?",
            "so": "<b>Sómalska (Soomaali):</b><br><b>Sharaxaad:</b> In wax la wanaajiyo, la hagaajiyo.<br>Ama in wax lagu daro. (fal)<br><b>Ereyo isku macno ah:</b> hagaajin, wanaajin, ku dar.<br><b>Ereyo lid ku ah:</b> dhaawicid, xumayn, yareyn.<br><b>Tusaalayaal:</b> 1. Waxaan dooneynaa inaan <b>wanaajino</b> afkeena Iceland. 2. Ma rabtaa inaad <b>ku darto</b> caano dheeraad ah?",
            "es": "<b>Spænska (Español):</b><br><b>Explicación:</b> Hacer algo mejor, arreglar.<br>O añadir más a algo. (verbo)<br><b>Sinónimos:</b> arreglar, mejorar, añadir.<br><b>Antónimos:</b> dañar, empeorar, reducir.<br><b>Ejemplos:</b> 1. Vamos a <b>mejorar</b> en islandés. 2. ¿Quieres <b>añadir</b> más leche?",
            "sw": "<b>Swahili (Kiswahili):</b><br><b>Maelezo:</b> Kufanya kitu kuwa bora, kutengeneza.<br>Au kuongeza zaidi. (kitenzi)<br><b>Visawe:</b> rekebisha, boresha, ongeza.<br><b>Vinyume:</b> haribu, fanya kuwa mbaya, punguza.<br><b>Mifano:</b> 1. Tutajaribu <b>kuboresha</b> kiicelandic chetu. 2. Unataka <b>kuongeza</b> maziwa zaidi?",
            "sv": "<b>Sænska (Svenska):</b><br><b>Förklaring:</b> Att göra något bättre, laga.<br>Eller att lägga till mer. (verb)<br><b>Synonymer:</b> laga, förbättra, tillsätta.<br><b>Antonymer:</b> förstöra, försämra, minska.<br><b>Exempel:</b> 1. Vi ska <b>förbättra</b> oss i isländska. 2. Vill du <b>lägga till</b> mer mjölk?",
            "th": "<b>Tælenska (ภาษาไทย):</b><br><b>คำอธิบาย:</b> ทำให้บางสิ่งดีขึ้น ซ่อมแซม<br>หรือเพิ่มเข้าไป (คำกริยา)<br><b>คำพ้องความหมาย:</b> แก้ไข, ปรับปรุง, เพิ่มเติม<br><b>คำตรงข้าม:</b> ทำลาย, ทำให้แย่ลง, ลดลง<br><b>ตัวอย่าง:</b> 1. เรากำลังจะ<b>ปรับปรุง</b>ภาษาไอซ์แลนด์ 2. คุณต้องการ<b>เติม</b>นมเพิ่มไหม?",
            "uk": "<b>Úkraínska (Українська):</b><br><b>Пояснення:</b> Зробити щось кращим, полагодити.<br>Або додати. (дієслово)<br><b>Синоніми:</b> виправити, покращити, додати.<br><b>Антоніми:</b> зіпсувати, погіршити, зменшити.<br><b>Приклади:</b> 1. Ми збираємося <b>покращити</b> свою ісландську. 2. Хочеш <b>додати</b> ще молока?",
            "vi": "<b>Víetnamska (Tiếng Việt):</b><br><b>Giải thích:</b> Làm cho tốt hơn, sửa chữa.<br>Hoặc thêm vào. (động từ)<br><b>Từ đồng nghĩa:</b> sửa chữa, cải thiện, thêm.<br><b>Từ trái nghĩa:</b> làm hỏng, làm xấu đi, giảm bớt.<br><b>Ví dụ:</b> 1. Chúng ta sẽ <b>cải thiện</b> tiếng Iceland. 2. Bạn có muốn <b>thêm</b> sữa không?",
            "de": "<b>Þýska (Deutsch):</b><br><b>Erklärung:</b> Etwas besser machen, reparieren.<br>Oder mehr hinzufügen. (Verb)<br><b>Synonyme:</b> reparieren, verbessern, hinzufügen.<br><b>Antonyme:</b> beschädigen, verschlechtern, verringern.<br><b>Beispiele:</b> 1. Wir werden uns im Isländischen <b>verbessern</b>. 2. Willst du mehr Milch <b>hinzufügen</b>?"
        }

    { 
        text: "almennur", 
        is_exp: "<b>Útskýring:</b> Eitthvað sem á við um allt fólk, er opinbert (t.d. frídagur).<br>Getur líka þýtt eitthvað sem er mjög venjulegt og algengt. (lýsingarorð)<br><b>Samheiti:</b> venjulegur, algengur, opinber.<br><b>Andheiti:</b> sérstakur, óvenjulegur, einka.<br><b>Dæmi:</b> 1. Þetta er <b>almennur</b> (opinber) frídagur fyrir allt fólk. 2. Þetta er <b>almennur</b> (algengur) misskilningur.",
        translations: {
            "sq": "<b>Albanska (Shqip):</b><br><b>Shpjegimi:</b> Diçka që zbatohet për të gjithë, publik.<br>Ose shumë e zakonshme. (mbiemër)<br><b>Sinonimet:</b> i përgjithshëm, i zakonshëm, publik.<br><b>Antonimet:</b> i veçantë, privat.<br><b>Shembuj:</b> 1. Kjo është një festë <b>publike</b>. 2. Ky është një keqkuptim i <b>përgjithshëm</b>.",
            "ar": "<div dir='rtl' style='text-align: right;'><b>Arabíska (العربية):</b><br><b>الشرح:</b> شيء ينطبق على جميع الناس، عام.<br>أو عادي جداً ושائع. (صفة)<br><b>مرادف:</b> عام، عادي، شائع.<br><b>مضاد:</b> خاص، غير عادي.<br><b>مثال:</b> 1. هذا يوم عطلة <b>عامة</b> للجميع. 2. هذا سوء فهم <b>شائع</b>.</div>",
            "da": "<b>Danska (Dansk):</b><br><b>Forklaring:</b> Noget der gælder alle, offentligt.<br>Eller meget normalt. (tillægsord)<br><b>Synonymer:</b> almindelig, generel, offentlig.<br><b>Antonymer:</b> speciel, usædvanlig, privat.<br><b>Eksempler:</b> 1. Dette er en <b>offentlig</b> fridag. 2. Dette er en <b>almindelig</b> misforståelse.",
            "et": "<b>Eistneska (Eesti):</b><br><b>Selgitus:</b> Miski, mis kehtib kõigile, avalik.<br>Või väga levinud. (omadussõna)<br><b>Sünonüümid:</b> ühine, üldine, avalik.<br><b>Antonüümid:</b> spetsiaalne, era-, ebatavaline.<br><b>Näited:</b> 1. See on <b>riigipüha</b> kõigile. 2. See on <b>üldine</b> arusaamatus.",
            "en": "<b>Enska (English):</b><br><b>Explanation:</b> Something that applies to all people, public.<br>Or very common and normal. (adjective)<br><b>Synonyms:</b> common, general, public.<br><b>Antonyms:</b> special, private, unusual.<br><b>Examples:</b> 1. This is a <b>public</b> holiday for everyone. 2. This is a <b>common</b> misunderstanding.",
            "tl": "<b>Filippseyska (Tagalog):</b><br><b>Paliwanag:</b> Bagay na naaangkop sa lahat, pampubliko.<br>O sobrang karaniwan. (pang-uri)<br><b>Kasingkahulugan:</b> karaniwan, pangkalahatan, pampubliko.<br><b>Kasalungat:</b> espesyal, pribado.<br><b>Halimbawa:</b> 1. Ito ay isang <b>pampublikong</b> holiday. 2. Ito ay isang <b>karaniwang</b> hindi pagkakaunawaan.",
            "fr": "<b>Franska (Français):</b><br><b>Explication:</b> Quelque chose qui s'applique à tous, public.<br>Ou très commun. (adjectif)<br><b>Synonymes:</b> commun, général, public.<br><b>Antonymes:</b> spécial, privé, rare.<br><b>Exemples:</b> 1. C'est un jour férié <b>public</b>. 2. C'est un malentendu <b>commun</b>.",
            "it": "<b>Ítalska (Italiano):</b><br><b>Spiegazione:</b> Qualcosa che si applica a tutti, pubblico.<br>O molto comune. (aggettivo)<br><b>Sinonimi:</b> comune, generale, pubblico.<br><b>Antonimi:</b> speciale, privato, insolito.<br><b>Esempi:</b> 1. Questa è una festa <b>pubblica</b>. 2. Questo è un malinteso <b>comune</b>.",
            "zh": "<b>Kínverska (中文):</b><br><b>解释:</b> 适用于所有人的事物，公众的。<br>或非常普遍的。 (形容词)<br><b>同义词:</b> 普遍的, 一般的, 公众的。<br><b>反义词:</b> 特殊的, 私人的。<br><b>例句:</b> 1. 这一天是所有人的<b>公共</b>假日。2. 这是一个<b>普遍</b>的误解。",
            "ku": "<b>Kúrdíska (Kurdî):</b><br><b>Ravekirin:</b> Tiştekî ku ji bo hemûyan derbasdar e, giştî.<br>An jî gelek asayî ye. (rengdêr)<br><b>Hevwate:</b> hevbeş, giştî.<br><b>Dijwate:</b> taybet, ne asayî.<br><b>Mînak:</b> 1. Ev betlaneyek <b>giştî</b> ye. 2. Ev şaşfêmkirinek <b>giştî</b> ye.",
            "lv": "<b>Lettneska (Latviešu):</b><br><b>Paskaidrojums:</b> Kaut kas, kas attiecas uz visiem, publisks.<br>Vai ļoti parasts. (īpašības vārds)<br><b>Sinonīmi:</b> parasts, vispārējs, publisks.<br><b>Antonīmi:</b> īpašs, privāts, neparasts.<br><b>Piemēri:</b> 1. Šī ir <b>publiska</b> brīvdiena. 2. Tas ir <b>vispārējs</b> pārpratums.",
            "lt": "<b>Litháíska (Lietuvių):</b><br><b>Paaiškinimas:</b> Taikoma visiems, vieša.<br>Arba labai įprasta. (būdvardis)<br><b>Sinonimai:</b> bendras, viešas, įprastas.<br><b>Antonimai:</b> ypatingas, privatus, retas.<br><b>Pavyzdžiai:</b> 1. Tai <b>vieša</b> šventė. 2. Tai yra <b>dažnas</b> nesusipratimas.",
            "no": "<b>Norska (Norsk):</b><br><b>Forklaring:</b> Noe som gjelder for alle, offentlig.<br>Eller veldig vanlig. (adjektiv)<br><b>Synonymer:</b> vanlig, allmenn, offentlig.<br><b>Antonymer:</b> spesiell, privat, uvanlig.<br><b>Eksempler:</b> 1. Dette er en <b>offentlig</b> fridag. 2. Dette er en <b>vanlig</b> misforståelse.",
            "fa": "<div dir='rtl' style='text-align: right;'><b>Persneska (فارسی):</b><br><b>توضیح:</b> چیزی که شامل همه می‌شود، عمومی.<br>یا بسیار رایج. (صفت)<br><b>مترادف:</b> عمومی، رایج، کلی.<br><b>متضاد:</b> خاص، خصوصی.<br><b>مثال:</b> 1. این یک تعطیلات <b>عمومی</b> است. 2. این یک سوء تفاهم <b>رایج</b> است.</div>",
            "pt": "<b>Portúgalska (Português):</b><br><b>Explicação:</b> Algo que se aplica a todos, público.<br>Ou muito comum. (adjetivo)<br><b>Sinônimos:</b> comum, geral, público.<br><b>Antônimos:</b> especial, privado, incomum.<br><b>Exemplos:</b> 1. Este é um feriado <b>público</b>. 2. Este é um mal-entendido <b>comum</b>.",
            "pt-BR": "<b>Portúgalska - Brasilía (Português - Brasil):</b><br><b>Explicação:</b> Algo que se aplica a todos, público.<br>Ou muito comum. (adjetivo)<br><b>Sinônimos:</b> comum, geral, público.<br><b>Antônimos:</b> especial, privado, incomum.<br><b>Exemplos:</b> 1. Este é um feriado <b>público</b>. 2. Este é um mal-entendido <b>comum</b>.",
            "pl": "<b>Pólska (Polski):</b><br><b>Wyjaśnienie:</b> Coś, co dotyczy wszystkich ludzi, publiczne.<br>Lub bardzo powszechne. (przymiotnik)<br><b>Synonimy:</b> powszechny, ogólny, publiczny.<br><b>Antonimy:</b> specjalny, prywatny, rzadki.<br><b>Przykłady:</b> 1. To jest <b>publiczne</b> święto. 2. To jest <b>powszechne</b> nieporozumienie.",
            "ro": "<b>Rúmenska (Română):</b><br><b>Explicație:</b> Ceva care se aplică tuturor, public.<br>Sau foarte comun. (adjectiv)<br><b>Sinonime:</b> comun, general, public.<br><b>Antonime:</b> special, privat, neobișnuit.<br><b>Exemple:</b> 1. Aceasta este o sărbătoare <b>publică</b>. 2. Aceasta este o neînțelegere <b>comună</b>.",
            "ru": "<b>Rússneska (Русский):</b><br><b>Объяснение:</b> То, что относится ко всем, общественное.<br>Или очень обычное. (прилагательное)<br><b>Синонимы:</b> общий, всеобщий, публичный.<br><b>Антонимы:</b> особенный, частный, необычный.<br><b>Примеры:</b> 1. Это <b>общественный</b> праздник. 2. Это <b>распространенное</b> недоразумение.",
            "so": "<b>Sómalska (Soomaali):</b><br><b>Sharaxaad:</b> Wax khuseeya dadka oo dhan, dadweyne.<br>Ama aad u caadi ah. (sifo)<br><b>Ereyo isku macno ah:</b> caadi, guud, dadweyne.<br><b>Ereyo lid ku ah:</b> gaar, aan caadi ahayn.<br><b>Tusaalayaal:</b> 1. Kani waa maalin fasax <b>guud</b>. 2. Tani waa faham la'aan <b>caadi</b> ah.",
            "es": "<b>Spænska (Español):</b><br><b>Explicación:</b> Algo que se aplica a todos, público.<br>O muy común. (adjetivo)<br><b>Sinónimos:</b> común, general, público.<br><b>Antónimos:</b> especial, privado, inusual.<br><b>Ejemplos:</b> 1. Este es un día festivo <b>público</b>. 2. Este es un malentendido <b>común</b>.",
            "sw": "<b>Swahili (Kiswahili):</b><br><b>Maelezo:</b> Kitu kinachohusu watu wote, umma.<br>Au cha kawaida sana. (kivumishi)<br><b>Visawe:</b> kawaida, kwa ujumla, umma.<br><b>Vinyume:</b> maalum, binafsi, isiyo ya kawaida.<br><b>Mifano:</b> 1. Hii ni likizo ya <b>umma</b>. 2. Huku ni kutoelewana kwa <b>kawaida</b>.",
            "sv": "<b>Sænska (Svenska):</b><br><b>Förklaring:</b> Något som gäller alla, offentligt.<br>Eller mycket vanligt. (adjektiv)<br><b>Synonymer:</b> allmän, vanlig, offentlig.<br><b>Antonymer:</b> speciell, privat, ovanlig.<br><b>Exempel:</b> 1. Detta är en <b>allmän</b> helgdag. 2. Detta är ett <b>vanligt</b> missförstånd.",
            "th": "<b>Tælenska (ภาษาไทย):</b><br><b>คำอธิบาย:</b> สิ่งที่ใช้ได้กับทุกคน เป็นของสาธารณะ<br>หรือเป็นเรื่องปกติมาก (คำคุณศัพท์)<br><b>คำพ้องความหมาย:</b> ทั่วไป, สาธารณะ, ธรรมดา<br><b>คำตรงข้าม:</b> พิเศษ, ส่วนตัว<br><b>ตัวอย่าง:</b> 1. นี่คือวันหยุด<b>สาธารณะ</b> 2. นี่คือความเข้าใจผิดที่เห็นได้<b>ทั่วไป</b>",
            "uk": "<b>Úkraínska (Українська):</b><br><b>Пояснення:</b> Те, що стосується всіх, публічне.<br>Або дуже звичайне. (прикметник)<br><b>Синоніми:</b> загальний, суспільний, звичайний.<br><b>Антоніми:</b> особливий, приватний.<br><b>Приклади:</b> 1. Це <b>державне</b> свято. 2. Це <b>поширене</b> непорозуміння.",
            "vi": "<b>Víetnamska (Tiếng Việt):</b><br><b>Giải thích:</b> Điều gì đó áp dụng cho mọi người, công cộng.<br>Hoặc rất bình thường. (tính từ)<br><b>Từ đồng nghĩa:</b> chung, phổ biến, công cộng.<br><b>Từ trái nghĩa:</b> đặc biệt, riêng tư.<br><b>Ví dụ:</b> 1. Đây là ngày nghỉ lễ <b>chung</b>. 2. Đây là một sự hiểu lầm <b>phổ biến</b>.",
            "de": "<b>Þýska (Deutsch):</b><br><b>Erklärung:</b> Etwas, das für alle gilt, öffentlich.<br>Oder sehr gewöhnlich. (Adjektiv)<br><b>Synonyme:</b> allgemein, gewöhnlich, öffentlich.<br><b>Antonyme:</b> speziell, privat, ungewöhnlich.<br><b>Beispiele:</b> 1. Dies ist ein <b>allgemeiner</b> Feiertag. 2. Das ist ein <b>häufiges</b> Missverständnis."
        }

    { 
        text: "hlutverk", 
        is_exp: "<b>Útskýring:</b> Verkefni eða starf sem einhver á að gera.<br>Einnig hlutverk persónu í leikriti eða bíómynd. (nafnorð)<br><b>Samheiti:</b> verkefni, starf, staða, karakter.<br><b>Dæmi:</b> 1. Þetta er hans <b>hlutverk</b> í skólanum. 2. Þetta er stórt <b>hlutverk</b> í myndinni.",
        translations: {
            "sq": "<b>Albanska (Shqip):</b><br><b>Shpjegimi:</b> Një detyrë që duhet bërë.<br>Ose një personazh në një film. (emër)<br><b>Sinonimet:</b> rol, funksion, detyrë.<br><b>Shembuj:</b> 1. Ky është <b>roli</b> i tij në shkollë. 2. Ky është një <b>rol</b> i madh në film.",
            "ar": "<div dir='rtl' style='text-align: right;'><b>Arabíska (العربية):</b><br><b>الشرح:</b> مهمة أو عمل يجب القيام به.<br>أو دور شخصية في فيلم. (اسم)<br><b>مرادف:</b> واجب، دور، وظيفة.<br><b>مثال:</b> 1. هذا هو <b>دوره</b> في المدرسة. 2. هذا <b>دور</b> كبير في الفيلم.</div>",
            "da": "<b>Danska (Dansk):</b><br><b>Forklaring:</b> En opgave man skal udføre.<br>Eller en rolle i en film. (navneord)<br><b>Synonymer:</b> pligt, rolle, stilling.<br><b>Eksempler:</b> 1. Dette er hans <b>rolle</b> i skolen. 2. Dette er en stor <b>rolle</b> i filmen.",
            "et": "<b>Eistneska (Eesti):</b><br><b>Selgitus:</b> Ülesanne või töö, mida tuleb teha.<br>Või tegelaskuju filmis. (nimisõna)<br><b>Sünonüümid:</b> kohustus, roll, funktsioon.<br><b>Näited:</b> 1. See on tema <b>roll</b> koolis. 2. See on suur <b>roll</b> filmis.",
            "en": "<b>Enska (English):</b><br><b>Explanation:</b> A task or job someone has to do.<br>Or a character in a movie. (noun)<br><b>Synonyms:</b> duty, role, function, part.<br><b>Examples:</b> 1. This is his <b>role</b> in the school. 2. This is a big <b>role</b> in the movie.",
            "tl": "<b>Filippseyska (Tagalog):</b><br><b>Paliwanag:</b> Isang gawain na dapat gawin.<br>O karakter sa pelikula. (pangngalan)<br><b>Kasingkahulugan:</b> tungkulin, papel.<br><b>Halimbawa:</b> 1. Ito ang kanyang <b>papel</b> sa paaralan. 2. Ito ay isang malaking <b>papel</b> sa pelikula.",
            "fr": "<b>Franska (Français):</b><br><b>Explication:</b> Une tâche qu'on doit accomplir.<br>Ou un rôle dans un film. (nom)<br><b>Synonymes:</b> devoir, rôle, fonction, personnage.<br><b>Exemples:</b> 1. C'est son <b>rôle</b> à l'école. 2. C'est un grand <b>rôle</b> dans le film.",
            "it": "<b>Ítalska (Italiano):</b><br><b>Spiegazione:</b> Un compito o lavoro da svolgere.<br>Oppure un personaggio in un film. (sostantivo)<br><b>Sinonimi:</b> dovere, ruolo, funzione.<br><b>Esempi:</b> 1. Questo è il suo <b>ruolo</b> nella scuola. 2. Questo è un grande <b>ruolo</b> nel film.",
            "zh": "<b>Kínverska (中文):</b><br><b>解释:</b> 某人必须完成的任务、工作。<br>或电影中的角色。 (名词)<br><b>同义词:</b> 责任, 角色, 作用。<br><b>例句:</b> 1. 这是他在学校的<b>角色</b>。 2. 这是电影里的一个大<b>角色</b>。",
            "ku": "<b>Kúrdíska (Kurdî):</b><br><b>Ravekirin:</b> Kar an erkek ku divê were kirin.<br>An jî karekterek di fîlmekê de. (navdêr)<br><b>Hevwate:</b> erk, rol.<br><b>Mînak:</b> 1. Li dibistanê <b>rol</b>a wî ev e. 2. Ev di fîlmê de <b>rol</b>ek mezin e.",
            "lv": "<b>Lettneska (Latviešu):</b><br><b>Paskaidrojums:</b> Uzdevums vai darbs, kas jādara.<br>Vai loma filmā. (lietvārds)<br><b>Sinonīmi:</b> pienākums, loma.<br><b>Piemēri:</b> 1. Šī ir viņa <b>loma</b> skolā. 2. Šī ir liela <b>loma</b> filmā.",
            "lt": "<b>Litháíska (Lietuvių):</b><br><b>Paaiškinimas:</b> Užduotis ar darbas, kurį kažkas turi atlikti.<br>Arba vaidmuo filme. (daiktavardis)<br><b>Sinonimai:</b> pareiga, vaidmuo.<br><b>Pavyzdžiai:</b> 1. Tai yra jo <b>vaidmuo</b> mokykloje. 2. Tai didelis <b>vaidmuo</b> filme.",
            "no": "<b>Norska (Norsk):</b><br><b>Forklaring:</b> En oppgave man må gjøre.<br>Eller en rolle i en film. (substantiv)<br><b>Synonymer:</b> plikt, rolle, stilling.<br><b>Eksempler:</b> 1. Dette er hans <b>rolle</b> på skolen. 2. Dette er en stor <b>rolle</b> i filmen.",
            "fa": "<div dir='rtl' style='text-align: right;'><b>Persneska (فارسی):</b><br><b>توضیح:</b> وظیفه‌ای که کسی باید انجام دهد.<br>یا نقش در یک فیلم. (اسم)<br><b>مترادف:</b> مسئولیت، نقش.<br><b>مثال:</b> 1. این <b>نقش</b> او در مدرسه است. 2. این <b>نقش</b> بزرگی در فیلم است.</div>",
            "pt": "<b>Portúgalska (Português):</b><br><b>Explicação:</b> Uma tarefa ou trabalho a fazer.<br>Ou um personagem num filme. (substantivo)<br><b>Sinônimos:</b> dever, papel, função.<br><b>Exemplos:</b> 1. Este é o <b>papel</b> dele na escola. 2. Este é um grande <b>papel</b> no filme.",
            "pt-BR": "<b>Portúgalska - Brasilía (Português - Brasil):</b><br><b>Explicação:</b> Uma tarefa ou trabalho a fazer.<br>Ou um personagem num filme. (substantivo)<br><b>Sinônimos:</b> dever, papel, função.<br><b>Exemplos:</b> 1. Este é o <b>papel</b> dele na escola. 2. Este é um grande <b>papel</b> no filme.",
            "pl": "<b>Pólska (Polski):</b><br><b>Wyjaśnienie:</b> Zadanie, praca do wykonania.<br>Lub rola postaci w filmie. (rzeczownik)<br><b>Synonimy:</b> obowiązek, rola, funkcja.<br><b>Przykłady:</b> 1. To jest jego <b>rola</b> w szkole. 2. To jest duża <b>rola</b> w filmie.",
            "ro": "<b>Rúmenska (Română):</b><br><b>Explicație:</b> O sarcină sau o muncă.<br>Sau un personaj dintr-un film. (substantiv)<br><b>Sinonime:</b> datorie, rol, funcție.<br><b>Exemple:</b> 1. Acesta este <b>rolul</b> lui la școală. 2. Acesta este un <b>rol</b> mare în film.",
            "ru": "<b>Rússneska (Русский):</b><br><b>Объяснение:</b> Задача, работа, которую кто-то выполняет.<br>Или роль в фильме. (существительное)<br><b>Синонимы:</b> обязанность, роль, функция.<br><b>Примеры:</b> 1. Это его <b>роль</b> в школе. 2. Это большая <b>роль</b> в фильме.",
            "so": "<b>Sómalska (Soomaali):</b><br><b>Sharaxaad:</b> Hawl ama shaqo ay tahay in la qabto.<br>Ama dabeecad (character) filim. (magac)<br><b>Ereyo isku macno ah:</b> waajib, door, shaqo.<br><b>Tusaalayaal:</b> 1. Kani waa <b>doorkiisa</b> dugsiga. 2. Kani waa <b>door</b> weyn oo filimka ah.",
            "es": "<b>Spænska (Español):</b><br><b>Explicación:</b> Una tarea o trabajo que hacer.<br>O un personaje en una película. (sustantivo)<br><b>Sinónimos:</b> deber, rol, papel, función.<br><b>Ejemplos:</b> 1. Este es su <b>rol</b> en la escuela. 2. Este es un gran <b>papel</b> en la película.",
            "sw": "<b>Swahili (Kiswahili):</b><br><b>Maelezo:</b> Kazi anayopaswa kufanya mtu.<br>Au mhusika katika filamu. (nomino)<br><b>Visawe:</b> jukumu, nafasi, kazi.<br><b>Mifano:</b> 1. Hili ni <b>jukumu</b> lake shuleni. 2. Hili ni <b>jukumu</b> kubwa katika filamu.",
            "sv": "<b>Sænska (Svenska):</b><br><b>Förklaring:</b> En uppgift eller ett jobb någon måste göra.<br>Eller en roll i en film. (substantiv)<br><b>Synonymer:</b> plikt, roll, uppgift.<br><b>Exempel:</b> 1. Detta är hans <b>roll</b> i skolan. 2. Detta är en stor <b>roll</b> i filmen.",
            "th": "<b>Tælenska (ภาษาไทย):</b><br><b>คำอธิบาย:</b> งานหรือหน้าที่ที่ต้องทำ<br>หรือบทบาทของตัวละครในภาพยนตร์ (คำนาม)<br><b>คำพ้องความหมาย:</b> หน้าที่, บทบาท<br><b>ตัวอย่าง:</b> 1. นี่คือ<b>บทบาท</b>ของเขาในโรงเรียน 2. นี่เป็น<b>บทบาท</b>ที่ยิ่งใหญ่ในภาพยนตร์",
            "uk": "<b>Úkraínska (Українська):</b><br><b>Пояснення:</b> Завдання або робота, яку треба виконати.<br>Чи роль у фільмі. (іменник)<br><b>Синоніми:</b> обов'язок, роль, функція.<br><b>Приклади:</b> 1. Це його <b>роль</b> у школі. 2. Це велика <b>роль</b> у фільмі.",
            "vi": "<b>Víetnamska (Tiếng Việt):</b><br><b>Giải thích:</b> Một nhiệm vụ hoặc công việc.<br>Hoặc vai diễn trong phim. (danh từ)<br><b>Từ đồng nghĩa:</b> bổn phận, vai trò, chức năng.<br><b>Ví dụ:</b> 1. Đây là <b>vai trò</b> của anh ấy ở trường. 2. Đây là một <b>vai trò</b> lớn trong phim.",
            "de": "<b>Þýska (Deutsch):</b><br><b>Erklärung:</b> Eine Aufgabe oder Arbeit.<br>Oder eine Rolle in einem Film. (Substantiv)<br><b>Synonyme:</b> Pflicht, Rolle, Aufgabe.<br><b>Beispiele:</b> 1. Das ist seine <b>Rolle</b> in der Schule. 2. Das ist eine große <b>Rolle</b> im Film."
        }
    }
];

let userScores = new Array(exerciseData.length).fill(null);
let userSpoken = new Array(exerciseData.length).fill("");

let currentIndex = 0;
let recognition;
let isRecording = false;
let autoAdvanceTimer = null;
let hasDownloadedCert = false;

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'is-IS';
    recognition.continuous = false;
    recognition.interimResults = false;
    
    recognition.onend = () => {
        isRecording = false;
        const btn = document.getElementById('record-btn');
        if (btn) {
            btn.innerText = "🎤 Tala";
            btn.classList.remove('recording');
        }
        
        const resDiv = document.getElementById('result');
        if (resDiv && resDiv.innerText === "Hlusta...") {
            resDiv.innerText = "";
        }
    };
} else {
    alert("Þessi vafri styður ekki talgreiningu. Notaðu Chrome eða Edge á tölvu.");
}

window.onload = () => { 
    updateUI(); 
};

function updateProgress() {
    let correctCount = 0;
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] === 100) {
            correctCount++;
        }
    }
    const percent = (correctCount / exerciseData.length) * 100;
    
    const progressBar = document.getElementById('progress-bar');
    if(progressBar) {
        progressBar.style.width = percent + '%';
    }
    return correctCount;
}

function findNextUnfinished() {
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] !== 100) {
            currentIndex = i;
            break;
        }
    }
    
    document.getElementById('app').innerHTML = `
        <h1>Markorð - Lota 2 - A2.2</h1>
        <div class="progress-container"><div id="progress-bar"></div></div>
        
        <div class="lang-selector">
            <label for="languageSelect"><b>🌍 Veldu tungumál:</b></label>
            <select id="languageSelect" onchange="updateUI()">
                <option value="sq">Albanska – Shqip</option>
                <option value="ar">Arabíska – العربية</option>
                <option value="da">Danska – Dansk</option>
                <option value="et">Eistneska – Eesti</option>
                <option value="en" selected>Enska – English</option>
                <option value="tl">Filippseyska – Tagalog / Filipino</option>
                <option value="fr">Franska – Français</option>
                <option value="it">Ítalska – Italiano</option>
                <option value="zh">Kínverska – 中文</option>
                <option value="ku">Kúrdíska – Kurdî</option>
                <option value="lv">Lettneska – Latviešu</option>
                <option value="lt">Litháíska – Lietuvių</option>
                <option value="no">Norska – Norsk</option>
                <option value="fa">Persneska – فارسی</option>
                <option value="pt">Portúgalska – Português (EU)</option>
                <option value="pt-BR">Portúgalska (Brasilía) – Português (BR)</option>
                <option value="pl">Pólska – Polski</option>
                <option value="ro">Rúmenska – Română</option>
                <option value="ru">Rússneska – Русский</option>
                <option value="so">Sómalska – Soomaali</option>
                <option value="es">Spænska – Español</option>
                <option value="sw">Swahili – Kiswahili</option>
                <option value="sv">Sænska – Svenska</option>
                <option value="th">Tælenska – ภาษาไทย</option>
                <option value="uk">Úkraínska – Українська</option>
                <option value="vi">Víetnamska – Tiếng Việt</option>
                <option value="de">Þýska – Deutsch</option>
            </select>
        </div>

        <div id="counter"></div>
        <div id="target"></div>
        <div id="is-explanation"></div>
        <br>
        <button id="record-btn" class="btn" onclick="toggleRecord()">🎤 Tala</button>
        <div id="spoken"></div>
        <div id="result"></div>
        <div id="media-box"></div>
        <div class="nav-btns">
            <button class="btn" style="background-color: #5f6368;" onclick="prevExercise()">⬅️ Fyrri</button>
            <button class="btn" style="background-color: #5f6368;" onclick="nextExercise()">Næsta ➡️</button>
        </div>
    `;
    updateUI();
}

function updateUI() {
    clearTimeout(autoAdvanceTimer); 
    const correctCount = updateProgress();

    if (currentIndex >= exerciseData.length) {
        if (correctCount === exerciseData.length) {
            document.getElementById('app').innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: 100%;"></div></div>
                <h1 style="color: #34a853; font-size: 2.5em;">Frábært! Þú náðir 100% árangri! 🎉</h1>
                <p style="font-size: 1.2em; color: #555;">Skrifaðu nafnið þitt hér að neðan til að sækja viðurkenningarskjalið þitt.</p>
                <input type="text" id="studentName" placeholder="Skrifaðu nafnið þitt hér" autocomplete="off" ${hasDownloadedCert ? 'disabled' : ''}><br>
                <button id="cert-btn" class="btn" style="background-color: ${hasDownloadedCert ? '#5f6368' : '#1a73e8'}; font-size: 1.5em; padding: 15px 30px; margin-top: 10px; cursor: ${hasDownloadedCert ? 'not-allowed' : 'pointer'}; opacity: ${hasDownloadedCert ? '0.7' : '1'};" onclick="downloadCert()" ${hasDownloadedCert ? 'disabled' : ''}>
                    ${hasDownloadedCert ? '✅ Skjal sótt' : '🏆 Sækja viðurkenningarskjal'}
                </button>
                <br><br>
                <button class="btn" style="background-color: #5f6368;" onclick="location.reload()">🔄 Byrja nýja umferð</button>
            `;
        } else {
            document.getElementById('app').innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: ${(correctCount/exerciseData.length)*100}%;"></div></div>
                <h1 style="color: #fbbc05; font-size: 2em;">Þú ert næstum því búin(n)!</h1>
                <p style="font-size: 1.2em;">Þú hefur klárað ${correctCount} af ${exerciseData.length} orðum með 100% árangri.</p>
                <p style="font-size: 1.1em; color: #555;">Farðu til baka og reyndu aftur við þau orð sem vantaði upp á til að fá skjalið.</p>
                <button class="btn" style="background-color: #fbbc05; color: #000;" onclick="findNextUnfinished()">➡️ Fara á orð sem vantar</button>
            `;
        }
        return;
    }

    const curr = exerciseData[currentIndex];
    
    const langSelect = document.getElementById('languageSelect');
    const selectedLang = langSelect ? langSelect.value : 'en';

    document.getElementById('target').innerHTML = curr.text;
    document.getElementById('is-explanation').innerHTML = curr.is_exp;
    document.getElementById('counter').innerText = `Orð ${currentIndex + 1} af ${exerciseData.length}`;
    
    document.getElementById('media-box').innerHTML = curr.translations[selectedLang] || "Þýðing ekki til / Translation missing";

    const savedScore = userScores[currentIndex];
    const savedText = userSpoken[currentIndex];

    if (savedScore !== null) {
        document.getElementById('result').innerText = `Einkunn: ${savedScore}%`;
        document.getElementById('spoken').innerText = `Þú sagðir: "${savedText}"`;
    } else {
        document.getElementById('result').innerText = "";
        document.getElementById('spoken').innerText = "";
    }
}

function nextExercise() {
    currentIndex++;
    updateUI();
}

function prevExercise() {
    if (currentIndex > 0) {
        currentIndex--;
        updateUI();
    }
}

function toggleRecord() {
    if (!recognition) return;

    const btn = document.getElementById('record-btn');
    if (isRecording) {
        recognition.stop();
    } else {
        try {
            recognition.start();
            isRecording = true;
            btn.innerText = "🛑 Hlusta...";
            btn.classList.add('recording');
            document.getElementById('result').innerText = "Hlusta...";
            document.getElementById('spoken').innerText = "";
        } catch(e) {
            console.log("Villa í upptöku: " + e);
        }
    }
}

if (recognition) {
    recognition.onresult = (event) => {
        let spoken = event.results[0][0].transcript;
        spoken = spoken.trim().toLowerCase(); 

        document.getElementById('spoken').innerText = `Þú sagðir: "${spoken}"`;
        
        const targetWord = exerciseData[currentIndex].text.toLowerCase();
        
        let score = (spoken === targetWord) ? 100 : 0;
        
        if (spoken.replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"").trim() === targetWord) {
            score = 100;
        }
        
        document.getElementById('result').innerText = `Einkunn: ${score}%`;

        userScores[currentIndex] = score;
        userSpoken[currentIndex] = spoken;
        
        updateProgress();

        if (score === 100) {
            autoAdvanceTimer = setTimeout(() => {
                nextExercise();
            }, 1000); 
        }
    };
}

function downloadCert() {
    if (hasDownloadedCert) return;

    const studentNameInput = document.getElementById('studentName');
    const studentName = studentNameInput ? studentNameInput.value.trim() : "";
    
    if (studentName === "") {
        alert("Vinsamlegast skrifaðu nafnið þitt fyrst!");
        return;
    }

    const canvas = document.createElement('canvas');
    canvas.width = 900;
    canvas.height = 600;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.strokeStyle = '#1a73e8';
    ctx.lineWidth = 15;
    ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

    ctx.strokeStyle = '#fbbc05';
    ctx.lineWidth = 5;
    ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
    
    ctx.fillStyle = '#1a73e8';
    ctx.textAlign = 'center';
    ctx.font = 'bold 50px Arial';
    ctx.fillText('Viðurkenning', canvas.width / 2, 140);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('Þetta skjal staðfestir að', canvas.width / 2, 220);
    
    ctx.fillStyle = '#000000';
    ctx.font = 'bold 45px Arial';
    ctx.fillText(studentName, canvas.width / 2, 290);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('hefur lokið æfingunni með glæsibrag:', canvas.width / 2, 360);

    ctx.fillStyle = '#1a73e8';
    ctx.font = 'bold 26px Arial';
    ctx.fillText('Markorð - Lota 2 - A2.2', canvas.width / 2, 420);
    
    ctx.fillStyle = '#34a853';
    ctx.font = 'italic 28px Arial';
    ctx.fillText('Frábær árangur! Haltu áfram að æfa þig.', canvas.width / 2, 490);

    const dateString = new Date().toLocaleDateString('is-IS');
    ctx.fillStyle = '#666666';
    ctx.font = '18px Arial';
    ctx.fillText('Dagsetning: ' + dateString, canvas.width / 2, 540);
    
    const link = document.createElement('a');
    link.download = `Vidurkenning_${studentName.replace(/\s+/g, '_')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    
    hasDownloadedCert = true;
    const btn = document.getElementById('cert-btn');
    if (btn) {
        btn.disabled = true;
        btn.innerText = "✅ Skjal sótt";
        btn.style.backgroundColor = "#5f6368";
        btn.style.cursor = "not-allowed";
        btn.style.opacity = "0.7";
    }
    if (studentNameInput) {
        studentNameInput.disabled = true;
    }
}
</script>

</body>
</html>
