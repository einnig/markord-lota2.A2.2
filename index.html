            100% { transform: scale(1); }

            "da": "<b>Danska (Dansk):</b><br><b>Forklaring:</b> En opgave man skal udføre, eller en rolle i et teaterstykke/film. (navneord)<br><b>Synonymer:</b> pligt, rolle, stilling.<br><b>Eksempler:</b> 1. Læreren har en vigtig rolle på skolen. 2. Han spillede en stor rolle i filmen.",
            "en": "<b>Enska (English):</b><br><b>Explanation:</b> A task, job someone has to do, or a character in a play/movie. (noun)<br><b>Synonyms:</b> duty, role, function, part.<br><b>Examples:</b> 1. The teacher has an important role in the school. 2. He played a big role in the movie.",
            "tl": "<b>Filippseyska (Tagalog):</b><br><b>Paliwanag:</b> Isang gawain/trabaho na dapat gawin, o karakter sa dula/pelikula. (pangngalan)<br><b>Kasingkahulugan:</b> tungkulin, papel.<br><b>Halimbawa:</b> 1. Ang guro ay may mahalagang papel sa paaralan. 2. Gumanap siya ng malaking papel sa pelikula.",
            "fr": "<b>Franska (Français):</b><br><b>Explication:</b> Une tâche qu'on doit accomplir, ou un rôle dans une pièce/film. (nom)<br><b>Synonymes:</b> devoir, rôle, fonction, personnage.<br><b>Exemples:</b> 1. Le professeur a un rôle important à l'école. 2. Il a joué un grand rôle dans le film.",
            "zh": "<b>Kínverska (中文):</b><br><b>解释:</b> 某人必须完成的任务、工作，或戏剧/电影中的角色。 (名词)<br><b>同义词:</b> 责任, 角色, 作用。<br><b>例句:</b> 1. 老师在学校里扮演着重要角色。 2. 他在电影中演了一个大角色。",
            "lv": "<b>Lettneska (Latviešu):</b><br><b>Paskaidrojums:</b> Uzdevums vai darbs, kas jādara, vai loma lugā/filmā. (lietvārds)<br><b>Sinonīmi:</b> pienākums, loma.<br><b>Piemēri:</b> 1. Skolotājam ir svarīga loma skolā. 2. Viņš spēlēja lielu lomu filmā.",
            "lt": "<b>Litháíska (Lietuvių):</b><br><b>Paaiškinimas:</b> Užduotis ar darbas, kurį kažkas turi atlikti, arba vaidmuo spektaklyje/filme. (daiktavardis)<br><b>Sinonimai:</b> pareiga, vaidmuo.<br><b>Pavyzdžiai:</b> 1. Mokytojas turi svarbų vaidmenį mokykloje. 2. Jis vaidino didelį vaidmenį filme.",
            "no": "<b>Norska (Norsk):</b><br><b>Forklaring:</b> En oppgave eller jobb noen må gjøre, eller en rolle i et teaterstykke/film. (substantiv)<br><b>Synonymer:</b> plikt, rolle, stilling.<br><b>Eksempler:</b> 1. Læreren har en viktig rolle på skolen. 2. Han spilte en stor rolle i filmen.",
            "fa": "<div dir='rtl' style='text-align: right;'><b>Persneska (فارسی):</b><br><b>توضیح:</b> وظیفه‌ای که کسی باید انجام دهد، یا نقش در یک نمایشنامه/فیلم. (اسم)<br><b>مترادف:</b> مسئولیت، نقش.<br><b>مثال:</b> 1. معلم نقش مهمی در مدرسه دارد. 2. او نقش بزرگی در فیلم بازی کرد.</div>",
            "pt": "<b>Portúgalska (Português):</b><br><b>Explicação:</b> Uma tarefa ou trabalho a fazer, ou um personagem numa peça/filme. (substantivo)<br><b>Sinônimos:</b> dever, papel, função.<br><b>Exemplos:</b> 1. O professor tem um papel importante na escola. 2. Ele teve um grande papel no filme.",
            "pl": "<b>Pólska (Polski):</b><br><b>Wyjaśnienie:</b> Zadanie, praca do wykonania, lub rola postaci w sztuce/filmie. (rzeczownik)<br><b>Synonimy:</b> obowiązek, rola, funkcja.<br><b>Przykłady:</b> 1. Nauczyciel ma ważną rolę w szkole. 2. Odegrał dużą rolę w filmie.",
            "ro": "<b>Rúmenska (Română):</b><br><b>Explicație:</b> O sarcină sau o muncă, sau un personaj dintr-o piesă/film. (substantiv)<br><b>Sinonime:</b> datorie, rol, funcție.<br><b>Exemple:</b> 1. Profesorul are un rol important în școală. 2. A jucat un rol mare în film.",
            "ru": "<b>Rússneska (Русский):</b><br><b>Объяснение:</b> Задача, работа, которую кто-то выполняет, или роль в пьесе/фильме. (существительное)<br><b>Синонимы:</b> обязанность, роль, функция.<br><b>Примеры:</b> 1. У учителя важная роль в школе. 2. Он сыграл большую роль в фильме.",
            "es": "<b>Spænska (Español):</b><br><b>Explicación:</b> Una tarea o trabajo que hacer, o un personaje en una obra/película. (sustantivo)<br><b>Sinónimos:</b> deber, rol, papel, función.<br><b>Ejemplos:</b> 1. El profesor tiene un rol importante en la escuela. 2. Interpretó un gran papel en la película.",
            "sv": "<b>Sænska (Svenska):</b><br><b>Förklaring:</b> En uppgift eller ett jobb någon måste göra, eller en roll i en pjäs/film. (substantiv)<br><b>Synonymer:</b> plikt, roll, uppgift.<br><b>Exempel:</b> 1. Läraren har en viktig roll i skolan. 2. Han spelade en stor roll i filmen.",
            "th": "<b>Tælenska (ภาษาไทย):</b><br><b>คำอธิบาย:</b> งานหรือหน้าที่ที่ต้องทำ หรือบทบาทของตัวละครในละคร/ภาพยนตร์ (คำนาม)<br><b>คำพ้องความหมาย:</b> หน้าที่, บทบาท<br><b>ตัวอย่าง:</b> 1. ครูมีบทบาทสำคัญในโรงเรียน 2. เขาเล่นบทบาทสำคัญในภาพยนตร์",
            "uk": "<b>Úkraínska (Українська):</b><br><b>Пояснення:</b> Завдання або робота, яку треба виконати, чи роль у виставі/фільмі. (іменник)<br><b>Синоніми:</b> обов'язок, роль, функція.<br><b>Приклади:</b> 1. Вчитель має важливу роль у школі. 2. Він зіграв велику роль у фільмі.",
            "vi": "<b>Víetnamska (Tiếng Việt):</b><br><b>Giải thích:</b> Một nhiệm vụ hoặc công việc, hoặc vai diễn trong vở kịch/phim. (danh từ)<br><b>Từ đồng nghĩa:</b> bổn phận, vai trò, chức năng.<br><b>Ví dụ:</b> 1. Giáo viên có vai trò quan trọng trong trường. 2. Anh ấy đóng một vai lớn trong phim.",
            "de": "<b>Þýska (Deutsch):</b><br><b>Erklärung:</b> Eine Aufgabe oder Arbeit, oder eine Rolle in einem Stück/Film. (Substantiv)<br><b>Synonyme:</b> Pflicht, Rolle, Aufgabe.<br><b>Beispiele:</b> 1. Der Lehrer hat eine wichtige Rolle in der Schule. 2. Er spielte eine große Rolle im Film."
        }
    }
];

let userScores = new Array(exerciseData.length).fill(null);
let userSpoken = new Array(exerciseData.length).fill("");

let currentIndex = 0;
let recognition;
let isRecording = false;
let autoAdvanceTimer = null;
let hasDownloadedCert = false;

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'is-IS';
    recognition.continuous = false;
    recognition.interimResults = false;
    
    recognition.onend = () => {
        isRecording = false;
        const btn = document.getElementById('record-btn');
        if (btn) {
            btn.innerText = "🎤 Tala";
            btn.classList.remove('recording');
        }
        
        const resDiv = document.getElementById('result');
        if (resDiv && resDiv.innerText === "Hlusta...") {
            resDiv.innerText = "";
        }
    };
} else {
    alert("Þessi vafri styður ekki talgreiningu. Notaðu Chrome eða Edge á tölvu.");
}

window.onload = () => { 
    updateUI(); 
};

function updateProgress() {
    let correctCount = 0;
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] === 100) {
            correctCount++;
        }
    }
    const percent = (correctCount / exerciseData.length) * 100;
    
    const progressBar = document.getElementById('progress-bar');
    if(progressBar) {
        progressBar.style.width = percent + '%';
    }
    return correctCount;
}

function findNextUnfinished() {
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] !== 100) {
            currentIndex = i;
            break;
        }
    }
    
    document.getElementById('app').innerHTML = `
        <h1>Markorð - Lota 2 - A2.2</h1>
        <div class="progress-container"><div id="progress-bar"></div></div>
        
        <div class="lang-selector">
            <label for="languageSelect"><b>🌍 Veldu tungumál:</b></label>
            <select id="languageSelect" onchange="updateUI()">
                <option value="ar">Arabíska – العربية</option>
                <option value="da">Danska – Dansk</option>
                <option value="en" selected>Enska – English</option>
                <option value="tl">Filippseyska – Tagalog / Filipino</option>
                <option value="fr">Franska – Français</option>
                <option value="zh">Kínverska – 中文</option>
                <option value="lv">Lettneska – Latviešu</option>
                <option value="lt">Litháíska – Lietuvių</option>
                <option value="no">Norska – Norsk</option>
                <option value="fa">Persneska – فارسی</option>
                <option value="pt">Portúgalska – Português</option>
                <option value="pl">Pólska – Polski</option>
                <option value="ro">Rúmenska – Română</option>
                <option value="ru">Rússneska – Русский</option>
                <option value="es">Spænska – Español</option>
                <option value="sv">Sænska – Svenska</option>
                <option value="th">Tælenska – ภาษาไทย</option>
                <option value="uk">Úkraínska – Українська</option>
                <option value="vi">Víetnamska – Tiếng Việt</option>
                <option value="de">Þýska – Deutsch</option>
            </select>
        </div>

        <div id="counter"></div>
        <div id="target"></div>
        <div id="is-explanation"></div>
        <br>
        <button id="record-btn" class="btn" onclick="toggleRecord()">🎤 Tala</button>
        <div id="spoken"></div>
        <div id="result"></div>
        <div id="media-box"></div>
        <div class="nav-btns">
            <button class="btn" style="background-color: #5f6368;" onclick="prevExercise()">⬅️ Fyrri</button>
            <button class="btn" style="background-color: #5f6368;" onclick="nextExercise()">Næsta ➡️</button>
        </div>
    `;
    updateUI();
}

function updateUI() {
    clearTimeout(autoAdvanceTimer); 
    const correctCount = updateProgress();

    if (currentIndex >= exerciseData.length) {
        if (correctCount === exerciseData.length) {
            document.getElementById('app').innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: 100%;"></div></div>
                <h1 style="color: #34a853; font-size: 2.5em;">Frábært! Þú náðir 100% árangri! 🎉</h1>
                <p style="font-size: 1.2em; color: #555;">Skrifaðu nafnið þitt hér að neðan til að sækja viðurkenningarskjalið þitt.</p>
                <input type="text" id="studentName" placeholder="Skrifaðu nafnið þitt hér" autocomplete="off" ${hasDownloadedCert ? 'disabled' : ''}><br>
                <button id="cert-btn" class="btn" style="background-color: ${hasDownloadedCert ? '#5f6368' : '#1a73e8'}; font-size: 1.5em; padding: 15px 30px; margin-top: 10px; cursor: ${hasDownloadedCert ? 'not-allowed' : 'pointer'}; opacity: ${hasDownloadedCert ? '0.7' : '1'};" onclick="downloadCert()" ${hasDownloadedCert ? 'disabled' : ''}>
                    ${hasDownloadedCert ? '✅ Skjal sótt' : '🏆 Sækja viðurkenningarskjal'}
                </button>
                <br><br>
                <button class="btn" style="background-color: #5f6368;" onclick="location.reload()">🔄 Byrja nýja umferð</button>
            `;
        } else {
            document.getElementById('app').innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: ${(correctCount/exerciseData.length)*100}%;"></div></div>
                <h1 style="color: #fbbc05; font-size: 2em;">Þú ert næstum því búin(n)!</h1>
                <p style="font-size: 1.2em;">Þú hefur klárað ${correctCount} af ${exerciseData.length} orðum með 100% árangri.</p>
                <p style="font-size: 1.1em; color: #555;">Farðu til baka og reyndu aftur við þau orð sem vantaði upp á til að fá skjalið.</p>
                <button class="btn" style="background-color: #fbbc05; color: #000;" onclick="findNextUnfinished()">➡️ Fara á orð sem vantar</button>
            `;
        }
        return;
    }

    const curr = exerciseData[currentIndex];
    
    const langSelect = document.getElementById('languageSelect');
    const selectedLang = langSelect ? langSelect.value : 'en';

    document.getElementById('target').innerHTML = curr.text;
    document.getElementById('is-explanation').innerHTML = curr.is_exp;
    document.getElementById('counter').innerText = `Orð ${currentIndex + 1} af ${exerciseData.length}`;
    
    document.getElementById('media-box').innerHTML = curr.translations[selectedLang] || "Þýðing ekki til / Translation missing";

    const savedScore = userScores[currentIndex];
    const savedText = userSpoken[currentIndex];

    if (savedScore !== null) {
        document.getElementById('result').innerText = `Einkunn: ${savedScore}%`;
        document.getElementById('spoken').innerText = `Þú sagðir: "${savedText}"`;
    } else {
        document.getElementById('result').innerText = "";
        document.getElementById('spoken').innerText = "";
    }
}

function nextExercise() {
    currentIndex++;
    updateUI();
}

function prevExercise() {
    if (currentIndex > 0) {
        currentIndex--;
        updateUI();
    }
}

function toggleRecord() {
    if (!recognition) return;

    const btn = document.getElementById('record-btn');
    if (isRecording) {
        recognition.stop();
    } else {
        try {
            recognition.start();
            isRecording = true;
            btn.innerText = "🛑 Hlusta...";
            btn.classList.add('recording');
            document.getElementById('result').innerText = "Hlusta...";
            document.getElementById('spoken').innerText = "";
        } catch(e) {
            console.log("Villa í upptöku: " + e);
        }
    }
}

if (recognition) {
    recognition.onresult = (event) => {
        let spoken = event.results[0][0].transcript;
        spoken = spoken.trim().toLowerCase(); 

        document.getElementById('spoken').innerText = `Þú sagðir: "${spoken}"`;
        
        const targetWord = exerciseData[currentIndex].text.toLowerCase();
        
        let score = (spoken === targetWord) ? 100 : 0;
        
        if (spoken.replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"").trim() === targetWord) {
            score = 100;
        }
        
        document.getElementById('result').innerText = `Einkunn: ${score}%`;

        userScores[currentIndex] = score;
        userSpoken[currentIndex] = spoken;
        
        updateProgress();

        if (score === 100) {
            autoAdvanceTimer = setTimeout(() => {
                nextExercise();
            }, 1000); 
        }
    };
}

function downloadCert() {
    if (hasDownloadedCert) return;

    const studentNameInput = document.getElementById('studentName');
    const studentName = studentNameInput ? studentNameInput.value.trim() : "";
    
    if (studentName === "") {
        alert("Vinsamlegast skrifaðu nafnið þitt fyrst!");
        return;
    }

    const canvas = document.createElement('canvas');
    canvas.width = 900;
    canvas.height = 600;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.strokeStyle = '#1a73e8';
    ctx.lineWidth = 15;
    ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

    ctx.strokeStyle = '#fbbc05';
    ctx.lineWidth = 5;
    ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
    
    ctx.fillStyle = '#1a73e8';
    ctx.textAlign = 'center';
    ctx.font = 'bold 50px Arial';
    ctx.fillText('Viðurkenning', canvas.width / 2, 140);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('Þetta skjal staðfestir að', canvas.width / 2, 220);
    
    ctx.fillStyle = '#000000';
    ctx.font = 'bold 45px Arial';
    ctx.fillText(studentName, canvas.width / 2, 290);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('hefur lokið æfingunni með glæsibrag:', canvas.width / 2, 360);

    ctx.fillStyle = '#1a73e8';
    ctx.font = 'bold 26px Arial';
    ctx.fillText('Markorð - Lota 2 - A2.2', canvas.width / 2, 420);
    
    ctx.fillStyle = '#34a853';
    ctx.font = 'italic 28px Arial';
    ctx.fillText('Frábær árangur! Haltu áfram að æfa þig.', canvas.width / 2, 490);

    const dateString = new Date().toLocaleDateString('is-IS');
    ctx.fillStyle = '#666666';
    ctx.font = '18px Arial';
    ctx.fillText('Dagsetning: ' + dateString, canvas.width / 2, 540);
    
    const link = document.createElement('a');
    link.download = `Vidurkenning_${studentName.replace(/\s+/g, '_')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    
    hasDownloadedCert = true;
    const btn = document.getElementById('cert-btn');
    if (btn) {
        btn.disabled = true;
        btn.innerText = "✅ Skjal sótt";
        btn.style.backgroundColor = "#5f6368";
        btn.style.cursor = "not-allowed";
        btn.style.opacity = "0.7";
    }
    if (studentNameInput) {
        studentNameInput.disabled = true;
    }
}
</script>

</body>
</html>
